[package]
name = "suncord-media"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
cc = "1"

[dependencies]
zeroize = "1"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
libloading = "0.8"
aes-gcm = "0.10"
futures-util = "0.3"
rand = "0.8"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "rt", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
