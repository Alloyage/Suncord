<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark background canvas glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121215" />
      <stop offset="100%" stop-color="#08080a" />
    </radialGradient>
    
    <!-- Sleek sunburst core gradient -->
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A1" />
      <stop offset="35%" stop-color="#FFB300" />
      <stop offset="85%" stop-color="#FF6F00" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>

    <!-- Faded soft outer rim -->
    <radialGradient id="fadedAura" cx="50%" cy="50%" r="48%">
      <stop offset="70%" stop-color="#FFAB00" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFAB00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />

  <!-- Outer aura glow -->
  <circle cx="256" cy="256" r="190" fill="url(#fadedAura)" />

  <!-- Core Sun Icon -->
  <circle cx="256" cy="256" r="140" fill="url(#sunGradient)" />
  
  <!-- Subtle inner eclipse stroke -->
  <circle cx="256" cy="256" r="139" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" />
</svg>
