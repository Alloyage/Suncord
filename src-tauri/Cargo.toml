[package]
name = "suncord"
version = "0.0.0"
description = "Native desktop client for Discord, built with Tauri"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
cmake = "0.1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }
cpal = "0.15"
rtrb = "0.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
url = "2"
parking_lot = "0.12"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
xcap = "0.5.2"
log = "0.4"
env_logger = "0.11"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-shell = "2"

[profile.dev]
incremental = true

[profile.dev.package.suncord]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
